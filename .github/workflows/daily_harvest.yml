name: Daily TWSE Harvest

# Runs after Taiwan market close (13:30 Taipei) plus a buffer for TWSE/MOPS
# to publish closing data. 16:30 Taipei == 08:30 UTC. Weekdays only.
#
# Pipeline (see src/harvester/daily.py):
#   T86, holdings, margin, revenue → atomic upsert
#   OHLCV current month for classified tickers + 0050 benchmark
#   News harvest (12 sources)
#   Sector + ticker momentum matview refresh
#   Quant signal compute (price + flow) → view_latest_signals refresh
#   Telegram daily-summary alert

on:
  schedule:
    - cron: '30 8 * * 1-5'    # 16:30 Taipei, Mon-Fri
  workflow_dispatch:           # manual trigger from Actions tab

env:
  # gssencmode=disable: GH Actions' libpq hangs on GSS encryption
  # negotiation against Neon's pooler. Forcing straight TLS fixes it.
  # /etc/hosts step also pins Neon hostname to IPv4 (GH IPv6 path is dead).
  DATABASE_URL: ${{ secrets.DATABASE_URL }}&gssencmode=disable
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TWSE_REQUEST_DELAY: '3.0'

jobs:
  harvest:
    runs-on: ubuntu-latest
    # Generous timeout — TWSE+OHLCV+news+signals can take ~30 min total at
    # the rate-limit cadence. Don't make it tighter than reality or healthy
    # runs will start getting killed mid-flight.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pin Neon hostname to IPv4 in /etc/hosts
        # GH runners advertise IPv6 but the path is dead, AND psycopg
        # with hostaddr= pins still hangs at TLS/SNI on Neon's pooler.
        # Editing /etc/hosts forces glibc getaddrinfo to return only
        # the IPv4 — DNS isn't consulted, libpq does normal hostname
        # connection with correct SNI, no IPv6 path tried at all.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ENTRY=$(python <<'PY'
          import os, socket, urllib.parse as u
          host = u.urlparse(os.environ['DATABASE_URL']).hostname
          ipv4 = sorted({sa[0] for fam,_,_,_,sa in socket.getaddrinfo(host, None) if fam == socket.AF_INET})[0]
          print(f"{ipv4}  {host}")
          PY
          )
          echo "$ENTRY" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily harvest
        run: python -m src.harvester.daily

      - name: Notify on failure
        if: failure()
        env:
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"🔴 alphatecx daily harvest FAILED — ${GITHUB_RUN_URL}\", \"parse_mode\": \"HTML\"}"
