name: Daily TWSE Harvest

# Runs after Taiwan market close (13:30 Taipei) plus a buffer for TWSE/MOPS
# to publish closing data. 16:30 Taipei == 08:30 UTC. Weekdays only.
#
# Re-enabled 2026-06-03: the prior pause (2026-05-27) was driven by an
# assumed Vercel CPU concern that did not materialise — the harvest runs
# on GitHub-hosted runners; only the post-step commit-back triggers a
# Vercel redeploy. See docs/wiki/decisions/2026-06-03-reenable-scheduled-harvest-crons.md.
#
# Pipeline (see src/harvester/daily.py):
#   T86, holdings, margin, revenue → atomic upsert
#   OHLCV current month for classified tickers + 0050 benchmark
#   News harvest (12 sources)
#   Sector + ticker momentum matview refresh
#   Quant signal compute (price + flow) → view_latest_signals refresh
#   Telegram daily-summary alert

on:
  schedule:
    - cron: '30 8 * * 1-5'    # 16:30 Taipei, Mon-Fri
  workflow_dispatch:           # manual trigger from Actions tab

env:
  # gssencmode=disable: GH Actions' libpq hangs on GSS encryption negotiation.
  # NOTE the `&` — the DATABASE_URL secret must already carry a query string
  # (it ends with ?sslmode=disable) or this suffix lands inside the db name.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}&gssencmode=disable
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  # Kill switch for all outbound Telegram. Set the repository variable
  # TELEGRAM_ENABLED to false to silence alerts without unsetting the
  # token — an unset token reads as breakage, an explicit false does not.
  TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'true' }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TWSE_REQUEST_DELAY: '3.0'
  # FinMind enrichment (nightly step 5e). Empty ⇒ the step self-skips.
  FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    # contents: write is required for the snapshot-refresh step that commits
    # the regenerated graph_snapshot.json back to main.
    permissions:
      contents: write
    # Generous timeout — TWSE+OHLCV+news+signals can take ~30 min total at
    # the rate-limit cadence. Don't make it tighter than reality or healthy
    # runs will start getting killed mid-flight.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Telegram token preflight
        # A bad or missing TELEGRAM_TOKEN is otherwise INVISIBLE: send() logs
        # and returns False, alerts sit at pushed:false, and even the
        # notify-on-failure step at the bottom of this file depends on the same
        # token — so the channel that would report the breakage is the broken
        # channel. getMe is free and answers definitively. continue-on-error:
        # a Telegram outage must not cost the harvest; the warning annotation
        # on the run is the deliverable.
        continue-on-error: true
        run: |
          if [ "${TELEGRAM_ENABLED,,}" = "false" ] || [ "${TELEGRAM_ENABLED}" = "0" ]; then
            echo "Telegram is switched off (TELEGRAM_ENABLED=$TELEGRAM_ENABLED) — skipping the check."
            exit 0
          fi
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::warning title=Telegram::TELEGRAM_TOKEN secret is unset — no alert from this repo can send"
            exit 1
          fi
          body=$(curl -s --max-time 10 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getMe")
          case "$body" in
            *'"ok":true'*) echo "Telegram token valid" ;;
            *) echo "::warning title=Telegram::TELEGRAM_TOKEN is invalid (getMe: ${body:0:120}) — alerts will record but never deliver"
               exit 1 ;;
          esac

      - name: Run daily harvest
        run: python -m src.harvester.daily

      - name: Generate post-close brief
        # Runs after the daily pipeline so signal_value + view_latest_signals
        # are fresh. Writes to daily_digest table + sends Telegram summary.
        # Failure here is non-fatal — the data is already in the DB; the
        # brief is just the human-facing message layer.
        if: success()
        continue-on-error: true
        run: python -m src.cron.brief --mode post_close

      - name: Risk Guard post-close pipeline
        # M1 risk light + M2 stop alerts + M2b settlement check + held_pct
        # snapshot (RISK_GUARD_PRD.md Phase 1). Runs after the harvest so
        # raw_twse_index / raw_twse_margin / raw_twse_ohlcv are fresh — the
        # scorer reads them, and stale inputs produce a confidently wrong
        # light rather than an obviously missing one.
        #
        # Deviation from the PRD, which schedules this at 15:30 on Vercel Cron:
        # there is no Vercel cron in this repo, so it rides the 16:30 Taipei
        # workflow and inherits the gssencmode fix.
        #
        # NOT continue-on-error, unlike the briefs and dashboards below: a
        # silent failure here is a stop-loss alert that never fired. The
        # pipeline isolates its own stages internally and only exits non-zero
        # after every stage has had its turn.
        if: success()
        run: python -m riskguard.pipeline --mode post_close

      - name: Recompute lead-lag pairs
        # Cross-correlation at lags 1..7 days for the classified universe.
        # Cheap (~15s); fed to MCP `q_lead_lag` tool. Non-fatal.
        if: success()
        continue-on-error: true
        run: python -m src.quant.leadlag --window 60 --max-lag 7

      - name: Thesis status heartbeat
        # Read docs/theses/*.md with status:active, post a structured
        # current-state report to Telegram + daily_digest. Non-fatal.
        if: success()
        continue-on-error: true
        run: python -m src.cron.thesis_status

      - name: Build data dashboard
        # Static HTML at mcp_server/api/static/dashboard-page.html with 4 tabs:
        # Watchlist / Theses / Discovery / Lead-lag. Served at /d/{TOKEN}/.
        if: success()
        continue-on-error: true
        run: python -m src.dashboard.build

      - name: Build per-ticker detail pages
        # One pre-rendered page per classified/watchlist/thesis ticker with
        # candlestick + Bollinger + foreign-flow + sector relative-strength
        # + thesis levels + news. Served at /d/{TOKEN}/t/{ticker}.
        if: success()
        continue-on-error: true
        run: python -m src.dashboard.build_ticker_pages

      - name: Regenerate 3D correlation snapshot
        # Refreshes mcp_server/api/static/graph_snapshot.json from the latest
        # OHLCV. Non-fatal: a stale snapshot is better than failing the run.
        if: success()
        continue-on-error: true
        run: python -m src.quant.correlation_snapshot --window 120

      - name: Commit & push refreshed snapshot + dashboard
        # All four static artefacts are sources of truth for the Vercel
        # routes (/g/, /d/, etc.). Push triggers a Vercel redeploy with the
        # new data. Skipped silently on no-change days (weekends/holidays).
        if: success()
        continue-on-error: true
        run: |
          git config user.name  "alphatecx-cron"
          git config user.email "alphatecx-cron@users.noreply.github.com"
          git add mcp_server/api/static/graph_snapshot.json \
                  mcp_server/api/static/graph-view.html \
                  mcp_server/api/static/graph-image.png \
                  mcp_server/api/static/dashboard-page.html \
                  mcp_server/api/static/ticker/
          if git diff --cached --quiet; then
            echo "no static-asset changes to commit"
          else
            git commit -m "chore(graph): daily refresh [skip ci]"
            git push origin main
          fi

      - name: Notify on failure
        if: failure()
        env:
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\": \"${TELEGRAM_CHAT_ID}\", \"text\": \"🔴 alphatecx daily harvest FAILED — ${GITHUB_RUN_URL}\", \"parse_mode\": \"HTML\"}"
