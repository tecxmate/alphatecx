name: CI

# The suite ran only on developer machines until 2026-08-11 — and `main`
# auto-deploys to the Zeabur `mcp` service on every push, so an untested commit
# was an untested production deploy. This gates PRs and reports on main.
#
# Note the limit: Zeabur deploys regardless of this workflow's outcome. CI can
# only block a MERGE, and only if branch protection on main requires the
# `test` check. Turn that on (Settings → Branches → main → require status
# checks) or this is advisory.
#
# Lint follows the repo convention (CLAUDE.md): `ruff check .`, repo-wide and
# unconditional. This comment used to say the opposite — "focused ruff on the
# files the PR touched, never repo-wide", describing the ~185-error backlog that
# was paid off on 2026-08-12. The Lint step below was updated then and this
# header was not, so for three weeks the file's own preamble told readers to
# reintroduce the changed-files gate that CLAUDE.md explicitly forbids.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Vestigial: this existed so the old changed-files lint could diff
          # against the PR base. Nothing in the job reads git history any more
          # (the suite does not shell out to git), so this is now only a slower
          # checkout. Left in place rather than changed in a PR about something
          # else — but it can go.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        # Both requirements files: tests import the harvester tree (polars,
        # feedparser) AND the deployed server tree (mcp, fastapi, psycopg).
        run: pip install -r requirements.txt -r mcp_server/requirements.txt pytest ruff

      - name: Run test suite
        # No network, no DB — the suite substitutes both by design.
        run: python -m pytest -q

      - name: Lint
        # Repo-wide, unconditionally. This was scoped to changed files while the
        # repo carried 185 pre-existing errors; that debt was paid off in the
        # three commits preceding this one, so the special-casing can go.
        #
        # Changed-files linting had a failure mode worth remembering: ruff checks
        # whole files, so touching any debt-carrying file inherited its debt and
        # blocked unrelated work. Narrowing further -- to changed LINES -- would
        # have been worse: ruff has no native support for it, and a diagnostic
        # your change causes is often reported on a line you did not touch (add
        # an import, I001 fires on the import block), so real problems would slip
        # through while other people's showed up in your diff.
        run: ruff check .
