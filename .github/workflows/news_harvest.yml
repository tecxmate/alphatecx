name: News Harvest + Briefs

# Taiwan-market-aware cron. Runs the news harvester at every slot.
# Scheduled Telegram briefs are disabled; manual workflow_dispatch can
# still run a selected brief mode.
#
# Prior scheduled brief mapping:
#
#   23:30 UTC = 07:30 Taipei (Mon-Fri) — pre_market brief (Telegram)
#   02:00 UTC = 10:00 Taipei (Mon-Fri) — intraday alerts (silent unless threshold)
#   04:00 UTC = 12:00 Taipei (Mon-Fri) — intraday alerts
#   06:30 UTC = 14:30 Taipei (Mon-Fri) — intraday alerts (T86 starting to publish)
#   13:00 UTC = 21:00 Taipei (daily)   — news harvest only
#   22:00 UTC = 06:00 Taipei (daily)   — news harvest only
#
# Post-close brief lives in daily_harvest.yml so it runs after the full
# TWSE+OHLCV+signals pipeline with fresh data.
#
# Re-enabled 2026-06-03: see docs/wiki/decisions/2026-06-03-reenable-scheduled-harvest-crons.md.
# Vercel CPU concern from the 2026-05-27 pause did not pan out; harvest runs
# on GitHub-hosted runners and the news job does not commit to main.
#
# News harvester is idempotent — re-runs are no-ops on unchanged feeds.

on:
  schedule:
    - cron: '30 23 * * 1-5'   # 07:30 Taipei pre-market
    - cron: '0 2 * * 1-5'     # 10:00 Taipei intraday
    - cron: '0 4 * * 1-5'     # 12:00 Taipei intraday
    - cron: '30 6 * * 1-5'    # 14:30 Taipei intraday (T86 publishes ~15:00)
    - cron: '0 13 * * *'      # 21:00 Taipei (US morning catch-up)
    - cron: '0 22 * * *'      # 06:00 Taipei (pre-Asia)
  workflow_dispatch:
    inputs:
      brief_mode:
        description: 'Manual brief mode'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'pre_market', 'intraday', 'post_close']

env:
  # Append gssencmode=disable — GH runner libpq hangs on Kerberos GSS
  # negotiation against Neon's pooler. Forces straight TLS.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}&gssencmode=disable
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  harvest_and_brief:
    runs-on: ubuntu-latest
    # 15 min buffer: harvest ~4-8s on cached feeds, brief ~3s. Plenty.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pin Neon hostname to IPv4 in /etc/hosts
        # GH runners advertise IPv6 but the path is dead. /etc/hosts
        # entry forces getaddrinfo to return only the IPv4 address.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ENTRY=$(python <<'PY'
          import os, socket, urllib.parse as u
          host = u.urlparse(os.environ['DATABASE_URL']).hostname
          ipv4 = sorted({sa[0] for fam,_,_,_,sa in socket.getaddrinfo(host, None) if fam == socket.AF_INET})[0]
          print(f"{ipv4}  {host}")
          PY
          )
          echo "$ENTRY" | sudo tee -a /etc/hosts

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Harvest news feeds
        run: python -m src.news.harvest

      - name: Run brief (mode depends on which cron fired)
        run: |
          # Scheduled Telegram briefs are off as of 2026-06-17. Keep the
          # workflow_dispatch path so a human can explicitly send one.
          MODE=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.brief_mode }}"
          else
            MODE='none'
          fi
          echo "Selected brief mode: $MODE"
          if [[ "$MODE" == "none" ]]; then
            echo "No brief for this schedule — harvest only"
          else
            python -m src.cron.brief --mode "$MODE"
          fi
