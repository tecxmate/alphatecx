name: News Harvest (4x daily)

# Intra-day RSS news harvest — separate from the daily TWSE pipeline so
# news flow keeps coming in even when markets are closed and so a TWSE
# failure doesn't block news ingestion.
#
# Schedule: 4 times per day at meaningful global market boundaries.
#   04:00 UTC = 12:00 Taipei (Asia mid-morning)
#   10:00 UTC = 18:00 Taipei (post-Asia close, US pre-market)
#   14:00 UTC = 22:00 Taipei (US morning)
#   22:00 UTC = 06:00 Taipei next day (US close)
#
# News harvester is idempotent — re-runs are no-ops on unchanged feeds.

on:
  schedule:
    - cron: '0 4,10,14,22 * * *'
  workflow_dispatch:

env:
  # Append gssencmode=disable — some PG servers (and middleware in front
  # of them) hang on the GSS encryption negotiation step from clients
  # with no Kerberos keytab. Disabling forces straight TLS.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}&gssencmode=disable

jobs:
  news:
    runs-on: ubuntu-latest
    # Each run is ~4 min (12 sources × ~20s avg). 15 min gives plenty
    # of buffer if a feed is slow but not so much that a hung run
    # silently eats hours of credits.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pin Neon hostname to IPv4 in /etc/hosts
        # GH runners advertise IPv6 but the path is dead; psycopg with
        # hostaddr= overrides also hangs at TLS/SNI on Neon's pooler
        # (cause not yet identified). Editing /etc/hosts forces glibc
        # getaddrinfo to return only the IPv4 address for our pooler
        # hostname — DNS isn't consulted, libpq does normal hostname
        # connection with correct SNI, no IPv6 path tried at all.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ENTRY=$(python <<'PY'
          import os, socket, urllib.parse as u
          host = u.urlparse(os.environ['DATABASE_URL']).hostname
          ipv4 = sorted({sa[0] for fam,_,_,_,sa in socket.getaddrinfo(host, None) if fam == socket.AF_INET})[0]
          print(f"{ipv4}  {host}")
          PY
          )
          echo "$ENTRY" | sudo tee -a /etc/hosts
          echo "--- /etc/hosts updated ---"
          tail -2 /etc/hosts

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Harvest news feeds
        run: python -m src.news.harvest
