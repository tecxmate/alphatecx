name: News Harvest (4x daily)

# Intra-day RSS news harvest — separate from the daily TWSE pipeline so
# news flow keeps coming in even when markets are closed and so a TWSE
# failure doesn't block news ingestion.
#
# Schedule: 4 times per day at meaningful global market boundaries.
#   04:00 UTC = 12:00 Taipei (Asia mid-morning)
#   10:00 UTC = 18:00 Taipei (post-Asia close, US pre-market)
#   14:00 UTC = 22:00 Taipei (US morning)
#   22:00 UTC = 06:00 Taipei next day (US close)
#
# News harvester is idempotent — re-runs are no-ops on unchanged feeds.

on:
  schedule:
    - cron: '0 4,10,14,22 * * *'
  workflow_dispatch:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  news:
    runs-on: ubuntu-latest
    # Each run is ~4 min (12 sources × ~20s avg). 15 min gives plenty
    # of buffer if a feed is slow but not so much that a hung run
    # silently eats hours of credits.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Prefer IPv4 (GH runners have no working IPv6)
        # Neon hostnames resolve to A + AAAA records; default Linux
        # getaddrinfo prefers IPv6, but the runner's IPv6 path is dead
        # so connections time out on the unreachable address. This
        # gai.conf line raises IPv4 precedence above IPv6.
        run: |
          sudo bash -c 'echo "precedence ::ffff:0:0/96 100" >> /etc/gai.conf'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose connection
        run: |
          set +e
          python -c "
          import os, socket, urllib.parse as u
          host = u.urlparse(os.environ['DATABASE_URL']).hostname
          print('Hostname:', host)
          ips4 = sorted({sa[0] for fam,_,_,_,sa in socket.getaddrinfo(host, None) if fam == socket.AF_INET})
          for ip in ips4: print('  IPv4:', ip)
          " | tee /tmp/ips.txt
          # Raw TCP probe to each IPv4 — does the runner have network reach at all?
          for ip in $(grep "IPv4:" /tmp/ips.txt | awk '{print $2}'); do
            echo "--- nc -vz $ip 5432 ---"
            timeout 8 nc -vz "$ip" 5432 2>&1 || echo "  TCP-failed"
          done
          echo "--- psycopg with direct (non-pooler) endpoint + IPv4 pin ---"
          python <<'PY'
          import os, traceback, urllib.parse as u
          import psycopg
          dsn = os.environ['DATABASE_URL'].replace('-pooler', '')
          for variant_name, extra in [
              ("direct host", ""),
              ("direct host + gssencmode=disable", "&gssencmode=disable"),
          ]:
              try:
                  print(f"--- {variant_name} ---")
                  with psycopg.connect(dsn + extra, connect_timeout=12) as c:
                      with c.cursor() as cur:
                          cur.execute("SELECT 1")
                          print(f"  CONNECTED ({variant_name})")
                          break
              except Exception as e:
                  print(f"  FAILED: {type(e).__name__}: {str(e)[:120]}")
          PY

      - name: Harvest news feeds
        run: python -m src.news.harvest
